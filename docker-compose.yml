services:
  postgres:
    image: postgres:16-alpine
    container_name: anviksa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anviksa}
      POSTGRES_USER: ${POSTGRES_USER:-anviksa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anviksa_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anviksa} -d ${POSTGRES_DB:-anviksa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anviksa-network

  redis:
    image: redis:7-alpine
    container_name: anviksa-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-anviksa_dev}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-anviksa_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - anviksa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anviksa-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anviksa}:${POSTGRES_PASSWORD:-anviksa_dev}@postgres:5432/${POSTGRES_DB:-anviksa}
      REDIS_URL: redis://:${REDIS_PASSWORD:-anviksa_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anviksa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anviksa-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - anviksa-network

volumes:
  postgres_data:
  redis_data:

networks:
  anviksa-network:
    driver: bridge